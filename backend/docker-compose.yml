services:
  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://fitai:${POSTGRES_PASSWORD}@db:5432/fitai
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FREE_DAILY_LIMIT: ${FREE_DAILY_LIMIT:-3}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    labels:
      - "caddy=${DOMAIN}"
      - "caddy.reverse_proxy={{upstreams 3000}}"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitai
      POSTGRES_USER: fitai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitai"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
    environment:
      CADDY_INGRESS_NETWORKS: fitai-backend_default

volumes:
  pgdata:
  caddy_data:
